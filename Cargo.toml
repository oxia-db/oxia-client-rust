[workspace]
members = [
    "oxia-client",
    "oxia-client-ffi",
    "oxia-perf"
]
resolver = "2"

[workspace.dependencies]
# The gRPC codegen and codecs only: the transport is hyper's HTTP/2 client on
# compio (tonic's own transport runs on tokio).
tonic = { version = "0.13", default-features = false, features = ["codegen", "prost"] }
tonic-types = "0.13"
prost = "0.13"
# The client runs on compio, never on a tokio runtime: only tokio's
# runtime-agnostic primitives (channels, Notify, watch, OnceCell, select!).
tokio = { version = "1.47.0", default-features = false, features = ["sync", "macros"] }
compio = { version = "0.19.2", default-features = false, features = ["runtime", "time", "net", "io", "io-uring", "polling"] }
cyper-core = "0.9.0"
hyper = { version = "1.7", features = ["client", "http2"] }
http = "1"
http-body-util = "0.1"
h2 = "0.4"
thiserror = "2.0.12"
xxhash-rust = { version = "0.8.5", features = ["xxh3"] }
uuid = { version = "1.7", features = ["v4"] }
tokio-util = "0.7"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic-build = "0.13.1"
protox = "0.7"
oxia-client = { path = "oxia-client" }
libc = "0.2"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
rand = "0.9"
mimalloc = "0.1"
# nanometer pins the API crate to =0.33.1.
opentelemetry = "0.33"
nanometer = "0.1"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

# OTel 0.33.1 with `MetricProducer` re-added, which nanometer's histogram
# export needs, until it is upstream
# (https://github.com/open-telemetry/opentelemetry-rust/issues/2505). The
# `otel` metrics test needs it; patching only the SDK would pull in a second
# copy of the API crate from the same repository. Patches apply to this
# workspace's builds only, not to the published crate.
[patch.crates-io]
opentelemetry = { git = "https://github.com/merlimat/opentelemetry-rust", branch = "metric-producer-0.33.1" }
opentelemetry_sdk = { git = "https://github.com/merlimat/opentelemetry-rust", branch = "metric-producer-0.33.1" }

# Optimize release builds (notably the oxia-perf benchmark binary): whole-program
# LTO and a single codegen unit trade compile time for a faster, smaller binary.
[profile.release]
lto = true
codegen-units = 1
strip = true

[package]
name = "oxia-client"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"

description = "Native Rust client SDK for Oxia, a distributed key-value store. Provides an idiomatic, asynchronous API on a single-threaded compio runtime."
license = "Apache-2.0"
repository = "https://github.com/oxia-db/oxia-client-rust"
homepage = "https://github.com/oxia-db/oxia-client-rust"
documentation = "https://docs.rs/oxia-client"
readme = "../README.md"
keywords = ["oxia", "client", "key-value", "metadata", "grpc"]
categories = ["database", "api-bindings", "asynchronous"]

[lib]
name = "oxia"

[dependencies]
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
compio = { workspace = true }
cyper-core = { workspace = true }
hyper = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
h2 = { workspace = true }
thiserror = { workspace = true }
xxhash-rust = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tonic-types = { workspace = true }
opentelemetry = { workspace = true, optional = true }
nanometer = { workspace = true, optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[features]
# OpenTelemetry metrics (scope `oxia_client`) through nanometer; off by default
# for a zero-cost build.
otel = ["dep:opentelemetry", "dep:nanometer"]
# TLS connections (rustls with the ring provider; OS trust roots by default).
tls = ["compio/rustls", "compio/ring", "dep:rustls-native-certs"]

# Build docs.rs with all optional features so the `otel` API is documented,
# with "Available on crate feature otel" badges (see the `docsrs` cfg in lib.rs).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
# Tests and examples run the client in a compio runtime; `signal` is for the
# examples' Ctrl-C handling.
compio = { workspace = true, features = ["macros", "signal"] }
# The in-process mock server (src/mock_server.rs) serves tonic's gRPC server,
# which runs on tokio, on threads of its own.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }
tonic = { workspace = true, features = ["transport", "router"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
# The otel metrics test exports nanometer's histograms through its `Producer`,
# which needs the SDK's `experimental_metrics_producer`: only in the patched SDK
# (see [patch.crates-io] in the root Cargo.toml). Without a version, publishing
# strips this dependency, so the crates.io SDK never has to have the feature.
nanometer = { workspace = true, features = ["sdk"] }
opentelemetry_sdk = { git = "https://github.com/merlimat/opentelemetry-rust", branch = "metric-producer-0.33.1", features = ["metrics", "testing", "experimental_metrics_producer"] }
rcgen = { workspace = true }
testcontainers = { version = "0.23", features = ["blocking"] }
testcontainers-modules = "0.11"

[build-dependencies]
tonic-build = { workspace = true }
protox = { workspace = true }

[[example]]
name = "security_tls"
required-features = ["tls"]

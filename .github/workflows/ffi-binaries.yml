# Builds `oxia-client-ffi` for each supported platform and, on a release,
# attaches the archives to it.
#
# `oxia-client-ffi` is `publish = false`, so these archives are the only way
# to get it without a Rust toolchain — which is the whole point: a wrapper SDK
# in Python, Node, C++ or C# should not need one, nor a matching MSRV.
#
# Called from release.yml with the tag being released, which is when the
# archives are uploaded. On a pull request that touches the crate it builds the
# same matrix and keeps the archives as run artifacts instead, so a platform
# that stops building is found then rather than on release day.
name: FFI binaries

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to attach the archives to.
        type: string
        required: true
      dry_run:
        description: Build and stamp as for a release, but keep the archives as run artifacts.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag to attach the archives to. Leave empty to build only.
        type: string
        required: false
  pull_request:
    branches: [main]
    paths:
      - oxia-client-ffi/**
      - oxia-client/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/ffi-binaries.yml

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      # Only the "Attach to the release" step uses this, and only for a real
      # release: a rehearsal and a pull request both keep the archives as run
      # artifacts instead.
      contents: write
    strategy:
      # One platform failing should not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # musl for callers that want to link statically, or to run on a
          # distribution whose glibc is older than the runner's. These build
          # in the image below, where musl is the host libc, so there is no
          # cross toolchain to install from the Ubuntu mirrors — whose outages
          # used to fail these two jobs before anything was compiled.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            image: rust:1.99.1-alpine3.24
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            image: rust:1.99.1-alpine3.24
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The gnu targets are built on the oldest runner still supported, so the
      # shared library does not require a newer glibc than a caller's
      # distribution has. Ubuntu 22.04 is glibc 2.35. The musl targets take
      # their toolchain from the image they build in instead.
      - name: Set up Rust
        if: ${{ !matrix.image }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The committed version is the `0.0.0-dev` placeholder and the tag is
      # what records a release's version, so stamp it in before building.
      # Without this the library would report `0.0.0-dev` through
      # `oxia_version_string()` out of an archive named after the release —
      # which is the mismatch that function exists to avoid. On a pull request
      # there is no tag and the placeholder is the honest answer.
      - name: Stamp the version from the tag
        if: ${{ inputs.tag || github.event.inputs.tag }}
        env:
          TAG: ${{ inputs.tag || github.event.inputs.tag }}
        run: python3 .github/scripts/stamp-version.py "$TAG"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # `docker run` rather than a `container:` job because the runner can
      # only execute JavaScript actions — checkout, cache — inside an Alpine
      # container on x64, and one of these two jobs is arm64. Only the
      # registry and the git checkouts are mounted into the image's
      # CARGO_HOME; mounting over it would hide cargo itself.
      - name: Build in ${{ matrix.image }}
        if: matrix.image
        run: |
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            "${{ matrix.image }}" \
            cargo build -p oxia-client-ffi --release --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.image }}
        run: cargo build -p oxia-client-ffi --release --target ${{ matrix.target }}

      # The header is checked in and CI already fails if it is stale, so it is
      # shipped as-is rather than regenerated here.
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.tag || github.event.inputs.tag || github.sha }}"
          name="oxia-client-ffi-${version}-${{ matrix.target }}"
          staging="$RUNNER_TEMP/$name"
          mkdir -p "$staging/lib" "$staging/include"

          built="target/${{ matrix.target }}/release"
          # A cdylib is .so on Linux and .dylib on macOS; both ship with the
          # staticlib, for callers that would rather link it in.
          for artifact in liboxia_client_ffi.so liboxia_client_ffi.dylib liboxia_client_ffi.a; do
            if [ -f "$built/$artifact" ]; then
              cp "$built/$artifact" "$staging/lib/"
            fi
          done
          if [ -z "$(ls -A "$staging/lib")" ]; then
            echo "::error::no libraries were built for ${{ matrix.target }}"
            exit 1
          fi

          cp oxia-client-ffi/oxia_client_ffi.h "$staging/include/"
          cp oxia-client-ffi/README.md "$staging/"
          cp LICENSE "$staging/"

          # The ABI version the header declares, which is what a caller
          # compares against oxia_abi_version() at run time. Recorded here so
          # the archive says which ABI it speaks without being unpacked.
          abi="$(sed -n 's/^#define OXIA_ABI_VERSION \([0-9]*\).*/\1/p' \
            oxia-client-ffi/oxia_client_ffi.h | head -1)"
          if [ -z "$abi" ]; then
            echo "::error::could not read OXIA_ABI_VERSION from the header"
            exit 1
          fi
          printf 'version: %s\ntarget: %s\nabi: %s\ncommit: %s\n' \
            "$version" "${{ matrix.target }}" "$abi" "$GITHUB_SHA" > "$staging/BUILD-INFO"

          tar -czf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP" "$name"
          ( cd "$RUNNER_TEMP" && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          {
            echo "archive=$RUNNER_TEMP/$name.tar.gz"
            echo "checksum=$RUNNER_TEMP/$name.tar.gz.sha256"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
          ls -l "$RUNNER_TEMP/$name.tar.gz"

      # Proves the header and the library in the archive agree, on the
      # platforms where this runner can run what it just built. Not the musl
      # archives: their library is musl-linked and the runner is glibc.
      - name: Check the archive against its own header
        if: "!matrix.image && !contains(matrix.target, 'x86_64-apple')"
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/${{ steps.package.outputs.name }}"
          cat > "$RUNNER_TEMP/abi.c" <<'EOF'
          #include <stdio.h>
          #include "oxia_client_ffi.h"
          int main(void) {
              if (oxia_abi_version() != OXIA_ABI_VERSION) {
                  fprintf(stderr, "library is ABI %u, header says %u\n",
                          oxia_abi_version(), OXIA_ABI_VERSION);
                  return 1;
              }
              return 0;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -I "$staging/include" \
            -o "$RUNNER_TEMP/abi" "$RUNNER_TEMP/abi.c" \
            -L "$staging/lib" -loxia_client_ffi
          LD_LIBRARY_PATH="$staging/lib" DYLD_LIBRARY_PATH="$staging/lib" "$RUNNER_TEMP/abi"

      - name: Upload as a run artifact
        if: ${{ inputs.dry_run || (!inputs.tag && !github.event.inputs.tag) }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Attach to the release
        if: ${{ !inputs.dry_run && (inputs.tag || github.event.inputs.tag) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.inputs.tag }}
        run: |
          gh release upload "$TAG" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.checksum }}" \
            --repo "$GITHUB_REPOSITORY" --clobber

name: Release-plz

on:
  push:
    branches: [main]

# Never run more than one release-plz invocation for a branch at a time.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publish any version merged from a release PR, then tag it and cut a GitHub
  # Release with notes generated from the commit history.
  release:
    name: Release
    if: github.repository == 'oxia-db/oxia-client-rust'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.released-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATE_TOKEN }}

      # The tag release-plz just created, which the FFI archives attach to.
      - name: Read the released tag
        id: released-tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag="$(echo "$RELEASES" | jq -r '.[0].tag')"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::release-plz reported a release with no tag: $RELEASES"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Keep a "release" PR open that bumps the version from the conventional
  # commits merged since the last release. Merging it triggers the release job.
  release-pr:
    name: Release PR
    if: github.repository == 'oxia-db/oxia-client-rust'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATE_TOKEN }}

  # Build the FFI for every supported platform and attach the archives to the
  # release that was just cut.
  #
  # This hangs off the release job rather than triggering on the release
  # event, because a release created with GITHUB_TOKEN does not start new
  # workflow runs — an `on: release` workflow would simply never fire.
  ffi-binaries:
    name: FFI binaries
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/ffi-binaries.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

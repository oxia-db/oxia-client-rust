name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  license:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Every tracked file must open with the Apache-2.0 header, except the
      # license itself, Cargo's generated lockfile, docs, test keys and
      # .gitignore.
      - name: Check license headers
        run: |
          missing=0
          while IFS= read -r f; do
            if ! head -n 20 "$f" | grep -q 'Licensed under the Apache License, Version 2.0'; then
              echo "::error file=$f::missing the Apache-2.0 license header"
              missing=1
            fi
          done < <(git ls-files -- . ':!:LICENSE' ':!:Cargo.lock' ':!:*.md' ':!:*.pem' ':!:.gitignore')
          exit $missing

  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy -p oxia-client --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace

      # oxia-client-ffi's header is checked in, so it can go stale against the
      # Rust it describes. cbindgen's formatting varies between releases, so
      # pin the version the header was generated with or the diff below is
      # noise.
      - name: Install cbindgen
        run: cargo install cbindgen --locked --version 0.29.4

      - name: Check the C header is up to date
        run: |
          cbindgen --config cbindgen.toml --crate oxia-client-ffi \
            --output "$RUNNER_TEMP/oxia_client_ffi.h"
          if ! diff -u oxia-client-ffi/oxia_client_ffi.h "$RUNNER_TEMP/oxia_client_ffi.h"; then
            echo "::error file=oxia-client-ffi/oxia_client_ffi.h::out of date; regenerate it (see oxia-client-ffi/README.md)"
            exit 1
          fi

      # The header is the contract for every caller of the FFI, C and C++
      # alike, so a change must not break either language. Compiling it is
      # enough to catch what goes wrong in practice: a C-only construct, a
      # missing extern "C", a name that collides.
      - name: Compile the C header as C and as C++
        run: |
          printf '%s\n' \
            '#include "oxia_client_ffi.h"' \
            'int main(void) {' \
            '    oxia_client_options options = {0};' \
            '    oxia_client *client = NULL;' \
            '    return oxia_client_new(&options, &client, NULL) == OXIA_OK;' \
            '}' > "$RUNNER_TEMP/header.c"
          printf '%s\n' \
            '#include "oxia_client_ffi.h"' \
            'int main() {' \
            '    oxia_client_options options = {};' \
            '    oxia_client *client = nullptr;' \
            '    return oxia_client_new(&options, &client, nullptr) == OXIA_OK;' \
            '}' > "$RUNNER_TEMP/header.cpp"
          for std in c99 c11 c17; do
            echo "== $std"
            cc -std=$std -Wall -Wextra -Werror -I oxia-client-ffi \
              -c "$RUNNER_TEMP/header.c" -o "$RUNNER_TEMP/header-$std.o"
          done
          for std in c++11 c++17 c++20; do
            echo "== $std"
            c++ -std=$std -Wall -Wextra -Werror -I oxia-client-ffi \
              -c "$RUNNER_TEMP/header.cpp" -o "$RUNNER_TEMP/header-$std.o"
          done

      - name: Build the C example
        run: |
          cmake -S oxia-client-ffi/examples -B "$RUNNER_TEMP/ffi-example"
          cmake --build "$RUNNER_TEMP/ffi-example"

      # The dockerized integration tests each start a container and, on a cold
      # runner, would otherwise all pull this image at once — concurrent pulls of
      # the same image race in the Docker client ("bytes remaining on stream").
      # Pull it once up front so the tests find it already present.
      - name: Pre-pull Oxia test image
        run: docker pull oxia/oxia:nightly-beta

      - name: Run tests
        run: cargo test --workspace

      # The default `cargo test` runs with the optional features off, so their
      # paths are never exercised above. Run the feature-gated tests explicitly
      # (the image is already pulled).
      - name: Run metrics test (otel feature)
        run: cargo test -p oxia-client --features otel --test it integration::test_metrics_recorded_through_meter_provider

      # Quoted: a bare trailing `tls::` ends the YAML scalar with `:`, which
      # makes the whole workflow file invalid.
      - name: Run TLS tests (tls feature)
        run: cargo test -p oxia-client --features tls --test it 'tls::'
